[project]
name = "ghist_plus"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.6.0",
    "torchvision==0.21.0",
    "numpy==1.26.4",
    "pandas==2.3.2",
    "scipy==1.15.3",
    "scikit-learn==1.7.1",
    "matplotlib==3.8.2",
    "tqdm",
    "natsort",
    "h5py",
    "tifffile",
    "imageio",
    "opencv-python",
    "pillow",
    "timm==0.9.12",
    "huggingface_hub==0.33.2",
    "torchstain==1.4.1",
    # stainlib is not on PyPI; installed directly from the upstream GitHub repo
    "stainlib @ git+https://github.com/sebastianffx/stainlib.git",
]

[project.optional-dependencies]
dev = [
    # for profiling
    "scalene>=2.3.0",
]
